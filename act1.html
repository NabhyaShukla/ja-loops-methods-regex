<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methods and RegEx</title>

    <style>
        .upper{
            padding: 1rem;
            background-color: orange;
            font-size: 20px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            max-width: fit-content;
            border-radius: 5px;
            box-shadow: 0 0 5px 5px rgba(0, 0, 0, 0.5);
        }

        p{
             padding: 1rem;
            background-color: orange;
            font-size: 20px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            max-width: fit-content;
            border-radius: 5px;
            box-shadow: 0 0 5px 5px rgba(0, 0, 0, 0.5);
        }

    </style>
</head>
<body>

    <p>Input = Nabhya</p>

    <h3 id="demo1"></h3>
    <button onclick="toUpper('nabhya')">Convert</button>

    <p>I am going to school tomorrow.</p>
    <p id="demo2"></p>
    <button onclick="isPresent()">Convert</button>

    <script>
        function toUpper(str){
            document.getElementById('demo1').innerHTML = str.toUpperCase();
             document.getElementById('demo1').classList.add("upper");
        }

        function isPresent(){
            var pattern = /tomorrow/;
            var str = "I am going to school tomorrow."
            var result = pattern.test(str);
            document.getElementById("demo2").innerHTML = "Presence of 'tomorrow' in my sentence : " + result;
        }
    </script>
    
</body>
</html>
