<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loops</title>
    <style>
        .loops {
            background-color: wheat;
            padding: 1rem;
            border-radius: 4px;
            box-shadow: 0px 0px 5px 5px rgbs(0, 0, 0, 0.7);
            max-width: fit-content;
        }
    </style>
</head>

<body>

    <p id="demo"></p>
    <button onclick="displayFruits()">Click</button>

    <script>
        function displayFruits() {
            const fruits = ["apple", "banana", "cherry", "kiwi", "mango"];

            for (let i = 0; i < fruits.length; i++) {
                document.getElementById("demo").innerHTML += fruits[i] + "<br>";
                document.getElementById("demo").classList.add("loops");
            }

        }                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
    </script>

</body>

</html>
